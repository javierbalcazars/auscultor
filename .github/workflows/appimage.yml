name: Construir AppImage Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar generador zsync
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsync
      - name: Construir AppImage Desktop actualizable
        run: AUSCULTOR_APPIMAGE_OUTPUT_DIR="$GITHUB_WORKSPACE/dist" npm run desktop:build
      - name: Verificar metadatos y generar checksums
        run: |
          node scripts/appimage-update-info.js verify dist/*.AppImage 'gh-releases-zsync|javierbalcazars|auscultor|latest|Auscultor-Desktop-*-x86_64.AppImage.zsync'
          cd dist
          sha256sum *.AppImage *.AppImage.zsync > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: Auscultor-Desktop-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publicar archivos en GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Auscultor ${{ github.ref_name }} Desktop
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/SHA256SUMS
