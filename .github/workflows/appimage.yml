name: Construir AppImage Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  desktop-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Construir AppImage Desktop
        run: AUSCULTOR_APPIMAGE_OUTPUT_DIR="$GITHUB_WORKSPACE/dist" npm run desktop:build
      - name: Generar checksum
        run: cd dist && sha256sum *.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Auscultor-Desktop-x86_64
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
